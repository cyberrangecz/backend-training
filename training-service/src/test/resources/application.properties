# For description of each field check: https://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
# JPA (JpaBaseConfiguration, HibernateJpaAutoConfiguration)
spring.data.jpa.repositories.enabled=true
spring.jpa.show-sql=true
# context
server.servlet.context-path=/training/api/v1
server.port=8080
# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE
# console noise
spring.main.banner-mode=off
logging.exception-conversion-word=%wEx{8}
logging.level.cz.cyberrange.platform.training.persistence.repository.UserRefRepositoryImpl=WARN
